server:
  port: 8083

spring:
  kafka:
    producer:
      properties:
        max.block.ms: 500
  application:
    name: leave-service
  datasource:
    url: jdbc:mysql://localhost:3306/leave_mgmt_leave?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
